# Base44 development compose — runs the app from cloned source with live reload.
# Reuse this file; do not adapt the project's own docker-compose.yaml (production images).

x-backend: &backend-base
  build:
    context: ./backend
    dockerfile: Dockerfile.dev
  volumes:
    - ./backend:/app
  env_file:
    - ./.env.base44-defaults
    - /run/base44/app.env
  environment:
    - DATABASE_URL=postgres://servicemarket:servicemarket@db:5432/servicemarket
    - FRONTEND_URL=*

services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=servicemarket
      - POSTGRES_USER=servicemarket
      - POSTGRES_PASSWORD=servicemarket
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicemarket"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: on-failure

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: on-failure

  migrate:
    <<: *backend-base
    command: ["python", "manage.py", "migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  server:
    <<: *backend-base
    ports:
      - "8000:8000"
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/services/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: on-failure

  worker:
    <<: *backend-base
    command: ["celery", "-A", "backend", "worker", "--loglevel=info", "--concurrency=1"]
    depends_on:
      redis:
        condition: service_healthy
      server:
        condition: service_started
    restart: on-failure

  client:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      - VITE_API_BASE_URL=https://8000-${BASE44_PUBLIC_HOST_SUFFIX}/api
      - VITE_WS_BASE_URL=wss://8000-${BASE44_PUBLIC_HOST_SUFFIX}
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-ec", "npm install && exec npm run dev -- --host 0.0.0.0"]
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: on-failure

volumes:
  pgdata:
  frontend_node_modules:
